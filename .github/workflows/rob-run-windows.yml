name: ROB RUN Windows x64
on:
  push:
    branches: [main]
    paths:
      - 'rob-run/full/**'
      - '.github/workflows/rob-run-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install packaging tools
        run: python -m pip install 'frida>=17,<18' 'pyinstaller>=6,<7'
      - name: Build DLL and launcher
        working-directory: rob-run/full
        run: .\build.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RobRun-Windows-x64
          path: rob-run/full/package/*
          if-no-files-found: error
      - name: Publish experimental Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          gh release create rob-run-windows-${{ github.run_id }}
          rob-run/full/RobRun-Windows-x64.zip
          --target ${{ github.sha }}
          --title 'ROB RUN Windows x64 (experimental)'
          --notes-file rob-run/full/RELEASE-NOTES.md
          --prerelease
